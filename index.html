<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Supranos Studio</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #0b0b0b;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
  }
  .cover {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
</style>
</head>
<body>
  <div class="cover">
    <picture>
      <source media="(max-width: 768px)" srcset="mobile.png">
      <img src="COVER.png" alt="Supranos Studio">
    </picture>
  </div>
</body>
</html>
