<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Supranos Studio</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #EDE9E4;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* Desktop / larger screens: show the full image, no cropping */
  .cover {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cover img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }

  /* Mobile: let the (tall) mobile image scroll in full instead of cropping */
  @media (max-width: 768px) {
    body { background: #ffffff; }
    .cover {
      width: 100%;
      height: auto;
      overflow: visible;
      display: block;
    }
    .cover img {
      max-width: 100%;
      max-height: none;
      width: 100%;
      height: auto;
      object-fit: initial;
      display: block;
    }
  }
</style>
</head>
<body>
  <div class="cover">
    <picture>
      <source media="(max-width: 768px)" srcset="mobile.png">
      <img src="COVER.png" alt="Supranos Studio">
    </picture>
  </div>
</body>
</html>
